<!doctype html>
<!-- Pagina local empacotada no APK e exibida pelo server.errorPath quando o site nao abre. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#071b2d" />
<title>Thoth Messenger — sem conexão</title>
<style>
  :root{color-scheme:dark;--sky:#36b8ee;--sky-2:#087fbe;--green:#79c843;--ink:#14384c;--muted:#58798a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    display:grid;place-items:center;min-height:100%;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
    overflow:hidden;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);text-align:center;
    background:radial-gradient(circle at 18% 14%,rgba(255,255,255,.92) 0 2%,transparent 20%),radial-gradient(circle at 85% 5%,rgba(255,255,255,.62),transparent 23%),linear-gradient(180deg,#8edcff 0%,#d9f4ff 49%,#eaf9ed 74%,#bce6a5 100%);
  }
  body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(1px);pointer-events:none}
  body::before{width:150vw;height:33vh;left:-30vw;bottom:-22vh;background:#77be50;box-shadow:0 -20px 50px rgba(68,151,45,.28)}
  body::after{width:115vw;height:25vh;right:-45vw;bottom:-17vh;background:#aadf78}
  .card{position:relative;z-index:1;width:min(390px,100%);padding:30px 25px 24px;border:1px solid rgba(255,255,255,.9);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(232,249,255,.72));box-shadow:0 24px 70px rgba(6,73,111,.24),inset 0 1px 0 #fff;backdrop-filter:blur(16px)}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:22px;color:#0877ad;font-size:.78rem;font-weight:800;letter-spacing:.04em}
  .brand-mark{display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:linear-gradient(145deg,var(--sky),var(--sky-2));color:#fff;box-shadow:0 5px 12px rgba(8,127,190,.28)}
  .signal{position:relative;width:94px;height:94px;margin:0 auto 21px;display:grid;place-items:center}
  .signal::before,.signal::after{content:"";position:absolute;border:2px solid rgba(8,127,190,.18);border-radius:50%;animation:ripple 2.6s ease-out infinite}
  .signal::before{inset:5px}.signal::after{inset:-8px;animation-delay:1.3s}
  .signal-core{position:relative;z-index:1;display:grid;place-items:center;width:72px;height:72px;border-radius:22px;background:linear-gradient(145deg,#fff,#d9f3ff);color:var(--sky-2);box-shadow:0 12px 28px rgba(8,127,190,.2)}
  .signal-slash{position:absolute;width:54px;height:3px;border-radius:3px;background:#e05b62;transform:rotate(-45deg);box-shadow:0 0 0 3px rgba(255,255,255,.82)}
  h1{margin:0 0 8px;font-size:1.45rem;letter-spacing:-.025em}
  p{max-width:310px;margin:0 auto;color:var(--muted);font-size:.9rem;line-height:1.55}
  .status{display:flex;align-items:center;justify-content:center;gap:7px;min-height:20px;margin:17px 0 13px;color:#477286;font-size:.75rem}
  .status-dot{width:7px;height:7px;border-radius:50%;background:#e05b62;box-shadow:0 0 0 4px rgba(224,91,98,.12)}
  .status.online{color:#397925}.status.online .status-dot{background:var(--green);box-shadow:0 0 0 4px rgba(121,200,67,.16)}
  button{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:50px;padding:12px 20px;border:1px solid rgba(4,107,158,.3);border-radius:15px;background:linear-gradient(180deg,var(--sky),var(--sky-2));color:#fff;font:700 .95rem inherit;cursor:pointer;box-shadow:0 10px 22px rgba(8,127,190,.28);transition:transform .15s ease,filter .15s ease}
  button:active{transform:translateY(1px);filter:brightness(.95)}button:disabled{cursor:wait;opacity:.75}
  .tip{margin-top:15px;font-size:.69rem;color:#6a8998}
  @keyframes ripple{0%{transform:scale(.72);opacity:0}25%{opacity:1}100%{transform:scale(1.18);opacity:0}}
  @media(prefers-reduced-motion:reduce){.signal::before,.signal::after{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z" /></svg></span>THOTH MESSENGER</div>
    <div class="signal" aria-hidden="true"><div class="signal-core"><svg width="39" height="39" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg><span class="signal-slash"></span></div></div>
    <h1>A conversa deu uma pausa</h1>
    <p>Não conseguimos chegar ao Thoth agora. Confira o Wi-Fi ou os dados móveis e tente se conectar novamente.</p>
    <div class="status" id="status"><span class="status-dot"></span><span id="status-text">Esperando uma conexão…</span></div>
    <button id="retry" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M6.1 9a7 7 0 0 1 11.5-2.6L20 9"/><path d="M17.9 15a7 7 0 0 1-11.5 2.6L4 15"/></svg><span>Tentar novamente</span></button>
    <div class="tip">Quando a internet voltar, o Thoth tenta reconectar sozinho.</div>
  </main>
<script>
  const appUrl = 'https://facincanitech.github.io/thoth/'
  const button = document.getElementById('retry')
  const status = document.getElementById('status')
  const statusText = document.getElementById('status-text')
  function reconnect() {
    button.disabled = true
    button.querySelector('span').textContent = 'Reconectando…'
    status.classList.add('online')
    statusText.textContent = 'Conexão encontrada'
    location.href = appUrl
  }
  button.addEventListener('click', reconnect)
  window.addEventListener('online', reconnect, { once: true })
  if (navigator.onLine) statusText.textContent = 'Toque abaixo para verificar a conexão'
</script>
</body>
</html>
