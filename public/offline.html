<!doctype html>
<!-- Página local, empacotada dentro do APK (não vem do site) — o app carrega a interface direto do
     site publicado; se não tiver internet na hora de abrir, o Capacitor mostra esta página no lugar
     (config server.errorPath no capacitor.config.ts), em vez de tela branca. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Thoth Messenger</title>
<style>
  :root{color-scheme:light dark}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    height:100%;padding:24px;box-sizing:border-box;text-align:center;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    background:#0f1115;color:#eef1f7;
  }
  h1{font-size:1.1rem;margin:0}
  p{margin:0;color:#9ca7b8;font-size:.9rem;max-width:320px;line-height:1.5}
  button{
    margin-top:8px;padding:12px 28px;border:0;border-radius:12px;background:#5865f2;color:#fff;
    font-weight:600;font-size:.95rem;cursor:pointer;
  }
  button:active{opacity:.8}
</style>
</head>
<body>
  <h1>Sem conexão</h1>
  <p>O Thoth Messenger precisa de internet pra abrir. Confere seu Wi-Fi ou dados móveis e tenta de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</body>
</html>
